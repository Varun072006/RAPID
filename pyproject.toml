[project]
name = "rapid-payment-recovery"
version = "0.1.0"
description = "Autonomous payment recovery engine — Razorpay AI Buildathon 2026"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.10",   # 2.9.10+ has Python 3.13 wheels
    "alembic>=1.13.0",
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-extra-types>=2.7.0",
    # ML  (all have 3.13 wheels)
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "scipy>=1.13.0",
    # Async & HTTP
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "redis>=5.0.1",
    # Observability
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    # Utilities
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "pyarrow>=17.0.0",           # 17+ has 3.13 wheels
    "ollama>=0.3.3",             # Qwen3 8B/14B via local Ollama
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "requests-mock>=1.12.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=packages --cov=apps --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
