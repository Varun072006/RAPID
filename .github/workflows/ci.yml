name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff
        run: uv run ruff check packages/ apps/ tests/ scripts/

      - name: Run black (check only)
        run: uv run black --check packages/ apps/ tests/ scripts/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rapid_test
          POSTGRES_USER: rapid
          POSTGRES_PASSWORD: rapid
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://rapid:rapid@localhost:5432/rapid_test
          REDIS_URL: redis://localhost:6379/0
          RAZORPAY_KEY_ID: rzp_test_fake
          RAZORPAY_KEY_SECRET: fake_secret
          RAZORPAY_WEBHOOK_SECRET: fake_webhook_secret
        run: uv run pytest tests/unit/ tests/contract/ tests/property/ -v --cov=packages --cov-report=xml

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://rapid:rapid@localhost:5432/rapid_test
          REDIS_URL: redis://localhost:6379/0
          RAZORPAY_KEY_ID: rzp_test_fake
          RAZORPAY_KEY_SECRET: fake_secret
          RAZORPAY_WEBHOOK_SECRET: fake_webhook_secret
        run: uv run pytest tests/integration/ tests/failure_injection/ -v

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
